<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UND Terminal</title>
    <link rel="stylesheet" href="terminal.css" />
  </head>
  <body>
    <main class="window">
      <header class="head">
        <div>
          <h1>Smart World Terminal</h1>
          <p>Run real PowerShell commands inside the Smart World workspace.</p>
        </div>
        <a href="../../os.html">Back to Desktop</a>
      </header>

      <section class="bridge-bar">
        <span id="bridgeStatus">Bridge: checking...</span>
        <span id="cwdLabel">cwd: loading...</span>
        <button id="startBridgeBtn" type="button">Start Bridge</button>
        <button id="copyBridgeCmdBtn" type="button">Copy Start Cmd</button>
      </section>

      <section class="terminal" id="terminalOutput"></section>

      <form id="cmdForm" class="cmd-form">
        <span class="prompt" id="promptLabel">sw@os:~$</span>
        <input id="cmdInput" type="text" autocomplete="off" placeholder="Type a real command: dir, git status, pwd, cd os" />
        <button type="submit">Run</button>
      </form>

      <section class="chips">
        <button type="button" class="chip" data-cmd="dir">dir</button>
        <button type="button" class="chip" data-cmd="pwd">pwd</button>
        <button type="button" class="chip" data-cmd="git status --short">git status</button>
        <button type="button" class="chip" data-cmd="cd os">cd os</button>
        <button type="button" class="chip" data-cmd="clear">clear</button>
      </section>

      <section class="history-box">
        <h2>Recent Commands</h2>
        <div id="cmdHistory" class="cmd-history"></div>
      </section>

      <section class="stats" id="termStats"></section>
    </main>
    <script src="terminal.js"></script>
  <script>
(function(){
  if (window.__smartChatLoaderInjected) return;
  window.__smartChatLoaderInjected = true;
  var tries = ['./vendor/smart-chatbot.js','../vendor/smart-chatbot.js','../../vendor/smart-chatbot.js','../../../vendor/smart-chatbot.js','../../../../vendor/smart-chatbot.js','../../../../../vendor/smart-chatbot.js'];
  var i = 0;
  function next(){
    if (i >= tries.length) return;
    var s = document.createElement('script');
    s.src = tries[i++];
    s.onload = function(){};
    s.onerror = next;
    document.head.appendChild(s);
  }
  next();
})();
</script>
</body>
</html>
