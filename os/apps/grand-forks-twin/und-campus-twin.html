  <body>
    <main class="shell">
      <aside class="panel left-panel">
        <p class="eyebrow">Smart World Facility Twin</p>
        <h1 id="facilityTitle">UND Campus Twin</h1>
        <p id="facilitySubtitle" class="subtitle"></p>

        <section class="control-block">
          <p class="label">Navigation</p>
          <a class="back-link" href="grand-forks-twin.html">Back To General Twin</a>
        </section>

        <section class="control-block">
          <p class="label">Smart Decision KPIs</p>
          <div id="kpiGrid" class="kpi-grid"></div>
        </section>

        <section class="control-block">
          <p class="label">Selected Asset</p>
          <div id="selectionCard" class="selection-card"></div>
        </section>
      </aside>

      <section class="stage-panel">
        <header class="stage-toolbar">
          <span>Auto-rotating UND twin. Inspect buildings, utilities, and mobility corridors.</span>
          <div>
            <button id="resetCameraBtn" type="button">Reset Camera</button>
            <button id="toggleDayBtn" type="button">Night Mode</button>
          </div>
        </header>
        <section class="stage-wrap">
          <div id="threeStage" class="three-stage"></div>
          <div class="hud">
            <div class="hud-card"><span>Mode</span><strong id="modeLabel">Night Simulation</strong></div>
            <div class="hud-card"><span>Assets</span><strong id="assetCount">0</strong></div>
            <div class="hud-card"><span>Scope</span><strong>UND</strong></div>
          </div>
        </section>
      </section>

      <aside class="panel right-panel">
        <section class="info-block">
          <h2>Campus Assets</h2>
          <div id="assetList" class="list"></div>
        </section>
        <section class="info-block">
          <h2>Insights For Smart Decisions</h2>
          <ul id="insightList" class="insight-list"></ul>
        </section>
      </aside>
    </main>

          { id: 'engineering-complex', name: 'Engineering Complex', x: 5, z: 1, height: 11, color: 0x7f8ef3, markerColor: 0xc8d0ff, status: 'Optimization active', kpi: 'Labs 91% uptime', desc: 'Lab-heavy facilities with high utility demand and sensitive scheduling constraints.' },

        ],
        paths: [
          { width: 1.8, color: 0x4858b2, points: [{ x: -18, z: 2 }, { x: -6, z: 1 }, { x: 8, z: 1 }] },
          { width: 1.6, color: 0x5263be, points: [{ x: -10, z: 14 }, { x: -8, z: 8 }, { x: -4, z: 2 }, { x: 0, z: -4 }] },

          'Dynamic wayfinding around the transit loop is projected to reduce pedestrian bottlenecks by 13%.'
